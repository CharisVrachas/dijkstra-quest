<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Σύνδεση – Dijkstra Quest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white" id="mainNav"></nav>

  <main class="py-4">
    <div class="container">
      <div class="card auth-card p-4">
        <h2 class="text-center mb-4" data-i18n="auth.login.title">Σύνδεση</h2>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" data-i18n="auth.username"></label>
            <input type="text" class="form-control" id="username"
                   data-i18n="auth.username" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="auth.password"></label>
            <input type="password" class="form-control" id="password"
                   data-i18n="auth.password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-3"
                  data-i18n="auth.login.btn">Σύνδεση</button>
          <div class="text-center">
            <a href="/register.html" data-i18n="auth.login.link">Εγγραφή</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await redirectIfLoggedIn();
      await buildNav('');
      i18n.apply();

      document.getElementById('loginForm').addEventListener('submit', async e => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const alertBox = document.getElementById('alertBox');
        alertBox.className = 'alert d-none';

        if (!username || !password) {
          alertBox.className = 'alert alert-warning';
          alertBox.textContent = 'Συμπλήρωσε username και κωδικό.';
          return;
        }

        const res = await apiPost('/api/auth/login', { username, password });
        if (res.success) {
          window.location.href = '/dashboard.html';
        } else {
          alertBox.className = 'alert alert-danger';
          alertBox.textContent = res.error || i18n.t('error.generic');
        }
      });
    });
  </script>
</body>
</html>
