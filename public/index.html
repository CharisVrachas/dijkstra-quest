<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dijkstra Quest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white" id="mainNav"></nav>

  <main>
    <!-- Hero -->
    <section class="hero text-center">
      <div class="container">
        <h1 class="mb-3" data-i18n="home.hero.title">Dijkstra Quest</h1>
        <p class="lead mb-2" data-i18n="home.hero.sub"></p>
        <p class="mb-4" data-i18n="home.hero.desc"></p>
        <a href="/login.html"    class="btn btn-light btn-lg me-2 mb-2" data-i18n="home.cta.play"></a>
        <a href="#features"      class="btn btn-outline-light btn-lg mb-2" data-i18n="home.cta.learn"></a>
      </div>
    </section>

    <!-- Features -->
    <section id="features" class="py-5">
      <div class="container">
        <div class="row g-4 justify-content-center">
          <div class="col-sm-6 col-lg-4">
            <div class="card feature-card p-4 text-center">
              <div class="feature-icon">🎲</div>
              <h5 data-i18n="home.feat.graph.t"></h5>
              <p class="text-muted small mb-0" data-i18n="home.feat.graph.d"></p>
            </div>
          </div>
          <div class="col-sm-6 col-lg-4">
            <div class="card feature-card p-4 text-center">
              <div class="feature-icon">🔍</div>
              <h5 data-i18n="home.feat.dijk.t"></h5>
              <p class="text-muted small mb-0" data-i18n="home.feat.dijk.d"></p>
            </div>
          </div>
          <div class="col-sm-6 col-lg-4">
            <div class="card feature-card p-4 text-center">
              <div class="feature-icon">🏆</div>
              <h5 data-i18n="home.feat.rank.t"></h5>
              <p class="text-muted small mb-0" data-i18n="home.feat.rank.d"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Demo graph -->
    <section class="py-5 bg-light">
      <div class="container">
        <div class="row align-items-center g-4">
          <div class="col-lg-5">
            <h3 class="fw-bold mb-3" data-i18n="home.demo.title"></h3>
            <p class="text-muted mb-4" data-i18n="home.demo.desc"></p>
            <div class="d-flex gap-3 flex-wrap">
              <span class="badge rounded-pill px-3 py-2" style="background:#198754">● <span data-i18n="game.source"></span></span>
              <span class="badge rounded-pill px-3 py-2" style="background:#dc3545">● <span data-i18n="game.dest"></span></span>
              <span class="badge rounded-pill px-3 py-2" style="background:#6f42c1">● <span data-i18n="home.demo.sp"></span></span>
            </div>
          </div>
          <div class="col-lg-7">
            <div id="democy" style="height:280px; border-radius:12px; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.08)"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- About section -->
    <section class="py-5 bg-white">
      <div class="container">
        <div class="row align-items-center g-5">
          <div class="col-lg-6">
            <h2 class="fw-bold mb-3" data-i18n="home.about.title"></h2>
            <p data-i18n="home.about.p1"></p>
            <p data-i18n="home.about.p2"></p>
            <a href="/register.html" class="btn btn-primary btn-lg" data-i18n="home.about.cta"></a>
          </div>
          <div class="col-lg-6 text-center">
            <div class="bg-light rounded-4 p-4">
              <div class="row g-3 text-start">
                <div class="col-12">
                  <div class="d-flex align-items-start gap-3">
                    <span class="fs-2">🗺️</span>
                    <div>
                      <strong data-i18n="home.step1.t"></strong><br>
                      <span class="text-muted small" data-i18n="home.step1.d"></span>
                    </div>
                  </div>
                </div>
                <div class="col-12">
                  <div class="d-flex align-items-start gap-3">
                    <span class="fs-2">🛣️</span>
                    <div>
                      <strong data-i18n="home.step2.t"></strong><br>
                      <span class="text-muted small" data-i18n="home.step2.d"></span>
                    </div>
                  </div>
                </div>
                <div class="col-12">
                  <div class="d-flex align-items-start gap-3">
                    <span class="fs-2">🔍</span>
                    <div>
                      <strong data-i18n="home.step3.t"></strong><br>
                      <span class="text-muted small" data-i18n="home.step3.d"></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      Dijkstra Quest &mdash; <span data-i18n="footer.uni"></span> &mdash; info@dijkstra-quest.gr
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await buildNav('home');
      i18n.apply();
      initDemoGraph();
    });

    function initDemoGraph() {
      cytoscape({
        container: document.getElementById('democy'),
        elements: [
          { data: { id: 's', label: 'Ελυσία'    }, position: { x: 260, y:  55 }, classes: 'source' },
          { data: { id: 'a', label: 'Ζεφυρία'   }, position: { x: 110, y: 155 } },
          { data: { id: 'b', label: 'Θαλερία'   }, position: { x: 130, y: 275 } },
          { data: { id: 'c', label: 'Νεφελία'   }, position: { x: 420, y: 115 } },
          { data: { id: 'd', label: 'Ροδανθία'  }, position: { x: 310, y: 215 } },
          { data: { id: 't', label: 'Ωκεανίδα'  }, position: { x: 390, y: 295 }, classes: 'dest' },

          { data: { id: 'e1', source: 's', target: 'a', weightLabel: '1.2 km' }, classes: 'shortest' },
          { data: { id: 'e2', source: 's', target: 'c', weightLabel: '2.4 km' } },
          { data: { id: 'e3', source: 'a', target: 'b', weightLabel: '0.8 km' }, classes: 'shortest' },
          { data: { id: 'e4', source: 'b', target: 't', weightLabel: '1.1 km' }, classes: 'shortest' },
          { data: { id: 'e5', source: 'c', target: 't', weightLabel: '3.2 km' } },
          { data: { id: 'e6', source: 'a', target: 'd', weightLabel: '1.5 km' } },
          { data: { id: 'e7', source: 'd', target: 't', weightLabel: '2.8 km' } },
          { data: { id: 'e8', source: 'c', target: 'b', weightLabel: '1.9 km' } }
        ],
        style: [
          { selector: 'node', style: {
            label: 'data(label)', 'background-color': '#546e7a', color: '#1a237e',
            'text-valign': 'bottom', 'text-halign': 'center', 'text-margin-y': 7,
            'font-size': 12, 'font-weight': '700',
            'text-background-color': '#fff', 'text-background-opacity': 0.95,
            'text-background-padding': '3px', 'text-border-radius': 3,
            width: 34, height: 34
          }},
          { selector: 'node.source', style: { 'background-color': '#198754', color: '#1b5e20' } },
          { selector: 'node.dest',   style: { 'background-color': '#dc3545', color: '#b71c1c' } },
          { selector: 'edge', style: {
            label: 'data(weightLabel)', width: 2.5, 'line-color': '#b0bec5',
            'font-size': 11, 'text-background-color': '#fff', 'text-background-opacity': 0.9,
            'text-background-padding': '2px', 'curve-style': 'bezier', color: '#546e7a'
          }},
          { selector: 'edge.shortest', style: { 'line-color': '#6f42c1', width: 5, color: '#4a148c' } }
        ],
        layout: { name: 'preset', fit: true, padding: 45 },
        userZoomingEnabled: false,
        userPanningEnabled: false,
        autoungrabify: true,
        autounselectify: true
      });
    }
  </script>
</body>
</html>
